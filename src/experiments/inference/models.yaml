models:
  - Qwen/Qwen3-VL-8B-Instruct
  # Qwen3-VL-8B-Thinking emits a long chain-of-thought *before* its final
  # JSON answer. At the pipeline's global MAX_TOKENS default (1024), it
  # was getting cut off mid-reasoning -- confirmed via raw_len ~4600-4700
  # chars (~1024 tokens) of unfinished prose, never reaching valid JSON
  # (Step N -> valid=False, items=0) on a large fraction of images, and
  # every call burning the full 1024-token budget just to get truncated,
  # which is why this model runs much slower than Instruct. Qwen's own
  # docs recommend up to max_new_tokens=40960 for thinking-mode VL tasks,
  # but that's calibrated for hard reasoning benchmarks (math/coding),
  # not short classification -- 8192 gives ~8x more headroom than the
  # global default while staying well under VLLM_MAX_MODEL_LEN=16384
  # once the image + prompt tokens are also accounted for.
  - id: Qwen/Qwen3-VL-8B-Thinking
    max_tokens: 8192
  # deepseek-ai/deepseek-vl2 (standard/full variant): ~27.5B total params,
  # ~55GB bf16 weights. Doesn't fit on a single A100 40GB card (DeepSeek's
  # own docs recommend 80GB+ for this variant), but fits comfortably on a
  # single H100 94GB (see gpu_h100 sbatch), leaving ~39GB headroom for KV
  # cache/vision encoder -- no tensor-parallel/multi-GPU needed. Its
  # native max_position_embeddings is only 4096 (vs. the pipeline's
  # global VLLM_MAX_MODEL_LEN default of 16384), so it needs a per-model
  # override here or vLLM will refuse to start the server.
  - id: deepseek-ai/deepseek-vl2
    max_model_len: 4096
  # zai-org/GLM-4.1V-9B-Thinking: 9B-param reasoning VLM (~18GB bf16), fits
  # comfortably on a single GPU. Like Qwen3-VL-8B-Thinking it emits a long
  # chain-of-thought *before* its final answer -- wrapped in
  # <think>...</think> followed by <answer>...</answer>. The pipeline's
  # _strip_thinking() keeps only content after the last </think> and
  # _try_parse_json()'s bracket-extraction fallback unwraps the remaining
  # <answer> tags around the JSON, so no extra parsing support is needed.
  # GLM's own benchmark harness interrupts thinking at 8192 tokens and then
  # forces completion, so 8192 is the calibrated budget here too (same
  # rationale as Qwen3-VL-8B-Thinking above): enough headroom over the
  # global MAX_TOKENS=1024 default while staying well under
  # VLLM_MAX_MODEL_LEN=16384 once image + prompt tokens are accounted for.
  # Native context is 64k, so no per-model max_model_len override needed.
  - id: zai-org/GLM-4.1V-9B-Thinking
    max_tokens: 8192
  # allenai/Molmo-7B-D-0924: 8B-param VLM (~17GB at half precision; the HF
  # config declares float32 but vLLM's auto dtype casts FP32 configs to
  # FP16), fits comfortably on a single GPU. Natively registered as
  # MolmoForCausalLM, and _launch_server() always passes
  # --trust-remote-code anyway. Non-thinking model -- plain JSON output,
  # no <think> tags -- so the global MAX_TOKENS=1024 default applies and
  # no per-model max_tokens override is needed. Its native
  # max_position_embeddings is only 4096, so like deepseek-vl2 it needs a
  # per-model max_model_len override or vLLM will refuse to start with
  # the global VLLM_MAX_MODEL_LEN=16384.
  # Molmo's chat template has NO system role (strict user/assistant
  # alternation): sending [system, user] makes every request fail with
  # 400 "Conversation roles must alternate user/assistant/..." (all
  # 1109 images failed instantly on the first real run). With
  # no_system_role=true, vlm_client.call_vlm() merges the system prompt
  # into the head of the user message instead of sending it as its own
  # turn. Also note _launch_server() overrides the server subprocess's
  # HF_HOME with HF_CACHE_DIR (config.py: $HF_CACHE_DIR, else $HF_HOME,
  # else <repo-root>/.hf_cache) -- any HF cache patching must target that
  # directory.
  #
  # CAUTION on vLLM versions: a preprocessing regression broke Molmo's
  # image patch ordering (issue #26451); the complete fix landed via PR
  # #26563 merged 2025-10-11, i.e. first shipped in release v0.11.1
  # (v0.11.0 predates it). requirements.txt pins vllm>=0.11.0 which pip
  # resolves to a much newer release, so this is fine in practice -- just
  # never pin the env to exactly 0.11.0.
  #
  # Truncation on first real run: ~20% of step-1 responses died at
  # completion_tokens=1024 (finish=length) mid-JSON-array, because Molmo
  # enumerates very long social-identity lists (dozens of Chinese
  # political labels) and the global MAX_TOKENS=1024 default cuts the
  # output before the closing bracket -> valid=False. max_tokens: 2048
  # roughly halves the truncation budget; it cannot go much higher
  # because Molmo's native context is only 4096 and observed step-1
  # prompts alone reach ~1800 tokens (steps 2-3 add identity/viewpoint
  # context on top) -- prompt+completion must fit in 4096 or vLLM
  # rejects the whole request. If 400 "maximum context length" errors
  # appear in the log, lower this instead.
  - id: allenai/Molmo-7B-D-0924
    max_model_len: 4096
    max_tokens: 2048
    no_system_role: true
  # meta-llama/Llama-3.2-11B-Vision-Instruct: 11B-param multimodal model
  # (~22GB bf16). Fits on A100 40GB with room for KV cache. Standard
  # instruct model with system role support. Native context is 128k but
  # the global VLLM_MAX_MODEL_LEN=16384 default is sufficient for this
  # pipeline (longest prompts reach ~2k tokens). No special parsing needed
  # -- produces plain JSON without thinking tags.
  - meta-llama/Llama-3.2-11B-Vision-Instruct
  # Qwen/Qwen2.5-VL-7B-Instruct: 7B-param multimodal model (~14GB bf16).
  # Fits on A100 40GB. Standard instruct model with system role support.
  # Native context is 32k; global VLLM_MAX_MODEL_LEN=16384 is sufficient.
  - Qwen/Qwen2.5-VL-7B-Instruct
  # mistralai/Pixtral-12B-2409: 12B-param multimodal model (~24GB bf16).
  # Fits on A100 40GB. Standard instruct model with system role support.
  # Native context is 128k; global VLLM_MAX_MODEL_LEN=16384 is sufficient.
  - id: mistralai/Pixtral-12B-2409
    max_model_len: 16384
  # The following models are excluded: none fit in a single GPU's memory
  # (H100 94GB or A100 40GB) even at the smallest publicly available
  # vLLM-compatible quantization. They could only fit across a full
  # 4-GPU H100 node (376GB total) with tensor-parallel-size 4, which
  # this pipeline doesn't currently support (vllm_manager.py launches
  # every model on a single GPU):
  #   Qwen/Qwen3-VL-235B-A22B-Thinking   -- 235B (22B active) params;
  #     smallest viable quant is a community AWQ build (~125GB), which
  #     only marginally fits and leaves little headroom for KV
  #     cache/vision encoder. Qwen's own guidance recommends >=8 GPUs
  #     with >=80GB each even for the official FP8 checkpoint (238GB).
  #   OpenGVLab/InternVL3_5-241B-A28B-HF -- 241B (28B active) params; no
  #     official or quality community INT4/AWQ/GPTQ quant exists, and
  #     vLLM doesn't support GGUF for this MoE architecture. OpenGVLab
  #     itself recommends 8x A100.
  #   meta-llama/Llama-4-Maverick-17B-128E-Instruct -- 402B total (17B
  #     active) params; smallest quant (AWQ/W4A16, ~215GB) already
  #     exceeds the 160GB budget. Meta's own FP8 checkpoint (417GB)
  #     targets a full 8-GPU DGX host.
  # - Qwen/Qwen3-VL-235B-A22B-Thinking
  # - OpenGVLab/InternVL3_5-241B-A28B-HF
  # - meta-llama/Llama-4-Maverick-17B-128E-Instruct
